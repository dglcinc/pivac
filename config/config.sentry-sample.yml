# pivac.Sentry sample config — ROI coordinates set by --calibrate interactive
# session on 2026-03-23 against a 2560x1440 frame.  Run --debug to verify,
# then copy the pivac.Sentry block into /etc/pivac/config.yml.

pivac.Sentry:
  rtsp_url: "rtsp://USERNAME:PASSWORD@10.0.0.19:554/stream1"

  # How long to poll the live stream waiting for all four display modes (seconds).
  # The Sentry 2100 cycles through modes ~0.5s each with ~1-2s pauses.
  # 30s gives two full cycles with comfortable margin.
  cycle_timeout: 30

  # Seconds the daemon loop sleeps between poll cycles. The RTSP decode + 7-seg
  # CV is CPU-heavy; without this the provider defaults to 0.5s and Sentry runs
  # near-continuously (~1.6 cores, which thermal-throttled the Pi). 15s keeps a
  # ~15-30s data cadence while cutting CPU well over half. Raise toward 30 for
  # more headroom if the boiler state doesn't need fine-grained sampling.
  daemon_sleep: 15

  # Consecutive frames the mode indicator must hold steady before cmd_test
  # accepts a display reading.  Prevents capturing transition-frame artefacts
  # (the display may show the previous mode's value for a frame while the
  # indicator light and digit segments switch simultaneously).
  mode_stable_frames: 3

  # Lit/background brightness ratios, split by LED type because the camera is
  # locked in IR/Night mode (green LEDs emit almost no near-IR, so they read much
  # dimmer than the bright display-mode indicators).
  #
  # led_ratio -> the four boiler STATUS LEDs (burner/circ/circ_aux/thermostat_demand).
  #   Live data 2026-07-20 during a firing: lit ~1.11-1.17, off ~0.85-0.96. 1.05 sits
  #   mid-gap. (A single 1.15 threshold read burner + circ_aux OFF for most of every
  #   call even with gas input pinned high — they only reach ~1.13 in IR.) An earlier
  #   1.15 calibration ("lit ~1.21-1.23") predates the permanent IR/Night lock that
  #   dimmed the green LEDs.
  led_ratio: 1.05
  #
  # indicator_ratio -> the display-mode + dhw_temp indicators (bright: lit ~1.29-1.46).
  #   Kept high so lowering the LED threshold can't cause a false display-mode read
  #   (which would misassign water/gas/outdoor values). Defaults to 1.15 if omitted.
  indicator_ratio: 1.15

  # Digit threshold factor for the DISPLAY-WIDE lit/off bar:
  #     threshold = bg + factor*(hi - bg)
  # where bg = display_bg_percentile of the whole display crop and hi = its 99th
  # percentile (a genuinely-lit segment — the units digit is always lit). The
  # same bar applies to every digit, so a BLANK digit (e.g. the hundreds position
  # for any temp < 100) can't manufacture a phantom from its own glare — the old
  # per-digit-crop threshold could, producing ~84 -> 184 spikes. Live data: lit
  # segments saturate ~255, off segments ~130-190, bg ~116, so factor 0.65 puts
  # the bar ~206 with wide margin (stable across 0.60-0.75). Raise if a faint
  # blank-digit glare still reads lit; lower if a dim real segment is missed.
  digit_threshold_factor: 0.65

  # Percentile of the display crop used as the dark-background reference for the
  # threshold above. 40 is robust on this mostly-dark panel; rarely needs tuning.
  display_bg_percentile: 40

  # Perspective warp: 4 corners of the LED glass in the original 2560x1440 frame.
  # Order: TL -> TR -> BR -> BL
  # Digit positions below are relative to the de-skewed rectified display.
  display_warp:
    corners:
      - {x: 1156, y: 655}  # TL
      - {x: 1324, y: 647}  # TR
      - {x: 1313, y: 719}  # BR
      - {x: 1148, y: 730}  # BL
    dst_w: 168
    dst_h: 75

  # Each digit's bounding box, relative to the RECTIFIED (de-skewed) display.
  digit_positions:
    - {x:    1, y:    1, w:   39, h:   73}  # hundreds
    - {x:   62, y:    1, w:   41, h:   73}  # tens
    - {x:  124, y:    1, w:   43, h:   73}  # units

  # Centre pixel of each green LED indicator (right of display panel).
  # Coordinates are in the original full frame.
  leds:
    burner:            {x: 1355, y: 643}
    circ:              {x: 1352, y: 669}
    circ_aux:          {x: 1353, y: 696}
    thermostat_demand: {x: 1350, y: 723}

  # Centre pixel of each display-mode indicator light (bottom of panel).
  # Whichever is lit identifies what value the 3-digit display is showing.
  indicators:
    water_temp: {x: 1156, y: 755}
    air:        {x: 1210, y: 749}
    gas_input:  {x: 1261, y: 744}
    dhw_temp:   {x: 1316, y: 743}
