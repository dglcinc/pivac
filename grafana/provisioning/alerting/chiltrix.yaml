        annotations:
          summary: "HZ-432 changed mode (heat/cool changeover) — the zone that forced it gets the old mode's water for ~30 min while the chiller swings the tank; see the Relays panel for which zone called"
          runbook: |
            Informational. The panel switched between heating and cooling because a zone
            called the mode the panel was not in. Read the Relays panel around this time:
            HPHEAT flipped, and the RedLink zone states show which thermostat called the
            other mode (a bedroom on Auto is the usual source in the shoulder season).
            Each changeover costs 25-45 min of compressor time and about 2 kWh, and the
            calling zone gets the wrong water until the tank swings. If these are common,
            build the aquastat interlock on the zone-valve common (plan section 7); if
            rare, put the two bedrooms on one mode per day.
