apiVersion: 1

# Chiltrix CX75 water-side fouling and health alerts. Source = the RS-485 Modbus link
# on A3/B3 (9600 8N1, slave 1, function 03) read by the planned pivac.ChiltrixModbus
# module -> Signal K -> InfluxDB (hvac.chiller.chiltrix.*). Routes to the same
# graph-bridge contact point as every other pivac rule.
#
# CONFIRMED BY A CONTROLLED TEST, 2026-08-29. The Y-strainer was cleaned (David judged
# it 30-50% blocked by eye) and startupFlow recovered from 22.9 to 54.0 L/min immediately,
# with flow at matched 24-28 Hz going 18.4 -> 39.6 and the evaporator dT 9.5 -> 5.6 degF.
#
# ---------------------------------------------------------------------------
# WHY THESE SIGNALS AND NOT THE OBVIOUS ONES
#
# Two plausible fouling signals were tested against 23.5 h of logged registers
# (2026-08-27 15:45 -> 2026-08-28 17:48, covering a clean period and a live
# restriction event) and BOTH were rejected:
#
#   Raw flow, or flow / Hz.  At a pinned 55 Hz the flow spans 42.5-52.9 L/min and
#   correlates +0.96 with outlet water temperature: the controller trims pump speed
#   to hold an evaporator dT (P53 floor 40%). The ratio is not load-independent —
#   it reaches 3.78 on the ramp-up, where the pump is already at full flow while the
#   compressor spools.
#
#   Inlet water (281) against the cooling target (142), meaned over hours.  The 6 h
#   rolling mean of inlet sat at 48.6-49.9 F across BOTH the clean and the degraded
#   period — a 1.3 F spread with no separation at all. The mean is dominated by the
#   idle rise between cycles, which the restart hysteresis bounds regardless of
#   restriction. End-of-cycle inlet fails for a related reason: during the event the
#   unit still reached its 44.6 F stop point, it just took 354 minutes to get there.
#
# What DID separate cleanly, measured across the same event:
#
#   startupFlow     52.9 -> 22.9 L/min   (the plateau around a compressor start)
#   flow at 25-27Hz 45-50 -> 17-19 L/min (matched compressor speed)
#
# Run duration separated in that one event (354 min against 9-22) but is NOT an
# alarmable quantity: on 2026-08-29, the day after the strainer was cleaned, runs
# lengthened with load to 232 minutes with startupFlow holding 50.5-54.0 the whole
# time. Runs have no maximum — the unit runs until inlet reaches its stop point, and
# a hot day plus a large zone call legitimately takes hours. The 90-minute rule
# built on it false-fired on that clean 232-minute run and was retired (see
# deleteRules below).
#
# The pump-only window removes compressor speed as a confound: the compressor is off,
# so nothing on the refrigerant side is moving the number. It is the Modbus equivalent
# of reading C13 on the panel in the pump-only window, which CLAUDE.md documents as the
# manual check.
#
# The competing explanation - that the controller was adaptively re-trimming its pump - is
# resolved rather than refuted. The controller DOES trim pump speed to hold an evaporator dT
# (P53 floor 40%), but the 28 Aug behaviour was the restriction DEFEATING that control: it ran
# 18.4 L/min at 9.5 degF, the pump as fast as the restriction allowed and the dT still not
# narrowing. Clean, it holds 5.6 degF with 39.6 L/min. Wide dT was the symptom of capped flow,
# not an operating point the controller chose.
#
# The decisive measurement was taken with the COMPRESSOR OFF - inlet and outlet within 0.2 degF,
# so no evaporator dT existed for the controller to hold - and flow still more than doubled on
# cleaning. That removes the confound by construction.
#
# ---------------------------------------------------------------------------
# THRESHOLDS, set from measured values on both sides:
#
#   startupFlow   clean 52.9-54.0   fouled 20.6-23.0   ALERT AT 40
# The 28 Aug decline ran 52.9 -> 35.6 over eleven hours before collapsing to 20.6, so 40 fires
# roughly a day before the plant misbehaves noticeably. THIS LOOP CAN LOSE HALF ITS FLOW IN
# ABOUT A WEEK - the 18-day interval from commissioning to the first blockage is NOT the prior.
#
# TWO FLOW RULES, TWO FAILURE SHAPES. startupFlow covers the gradual case (fouling, over
# hours to days). It is blind to the instantaneous case — a closed valve — because the 15 L/min
# floor that keeps the deep-idle trickle out of the plateau also discards a genuine 0.0, so a
# total loss of flow publishes the healthiest startupFlow value there is. chiltrix-zero-flow
# covers that. Neither substitutes for the other.
#
# To retire a rule from this file later, add a top-level deleteRules: block naming
# its uid — provisioning is ADDITIVE and deleting a rule from the group does NOT
# remove it from Grafana (see CLAUDE.md).
groups:
  - orgId: 1
    name: chiltrix
    folder: pivac
    interval: 1m
    rules:
      # ---- Pump-only flow low: the primary fouling signal ----
      # Clean 52.9 L/min, degraded 24.1. Fires at 40, which is 24% below clean and
      # twice the P65 = 20 L/min P5 trip, so it warns hours-to-days ahead of a trip.
      # 'last' rather than 'mean' because the value is held between pump-only windows.
      - uid: chiltrix-pump-only-flow-low
        title: Chiltrix startup flow low (water-side restriction)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 10800
              to: 0
            datasourceUid: bdxaqnfllu5fkf
            model:
              datasource:
                type: influxdb
                uid: bdxaqnfllu5fkf
              measurement: hvac.chiller.chiltrix.startupFlow
              policy: default
              resultFormat: time_series
              orderByTime: ASC
              groupBy:
                - type: time
                  params:
                    - $__interval
                - type: fill
                  params:
                    - none
              select:
                - - type: field
                    params:
                      - value
                  - type: mean
                    params: []
              tags: []
              refId: A
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 10800
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
              refId: B
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 10800
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 40
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: OK
        execErrState: OK
        for: 30m
        annotations:
          summary: "Chiltrix startup flow has fallen below 40 L/min — water-side restriction, clean the Y-strainer"
          runbook: |
            hvac.chiller.chiltrix.startupFlow is the flow plateau around a compressor
            start — a flat 52.9 L/min held from ~70 s before the compressor engages until
            ~140 s into the run, spanning the power ramp. Clean is 52.9-54.0 L/min; it fell
            to 20.6-23.0 during the 2026-08-28 fouling, and cleaning the Y-strainer restored
            it to 54.0 within one cycle.

            The Y-strainer is the first suspect and has been the cause both times. It fouls
            with calcium-looking scale migrating from the boiler side of the shared four-pipe
            loop. THE VISUAL UNDERSTATES IT BADLY: on 2026-08-29 the screen looked 30-50%
            blocked by eye while costing 60% of the flow, because a Y-strainer screen carries
            several times the pipe's open area. Judge by this metric, not by looking.

            It did exactly this on 2026-08-22 too (P5 alarms, C13 over 54 L/min after
            cleaning). A partly closed isolation valve or an air lock reads the same way.

            1. Confirm on the panel: C13 is the live flow readout. Read it in the 1-2
               minute pump-only window at the start of a run — C13 reads 0 at idle and
               that is normal.
            2. Pull and clean the Y-strainer screen. Expect startupFlow to return to
               ~52-54 L/min within one cycle; if it does not, the restriction is elsewhere
               — a partly closed isolation valve, an air lock, or the pump itself.
            3. Do NOT open the autofill to recover pressure. This is a glycol loop —
               plain water carries in the calcium and oxygen that caused the fouling,
               dilutes the glycol silently, and hides leaks. Top up manually with
               premixed glycol to the 21-23 psi the loop normally holds, then vent.
            4. Permanent fix is a hydronic dirt separator with a blowdown valve. A finer
               in-line filter clogs faster than the Y does.
        labels:
          severity: warning
          source: chiltrix
        isPaused: false
        notification_settings:
          receiver: graph-bridge

      # ---- Zero water flow while the unit is commanded on ----
      # THE FOULING RULE IS BLIND TO A TOTAL LOSS OF FLOW, which is what motivated this one.
      # During the 2026-09-03 lockout startupFlow published 54.0 L/min — the HIGHEST value of
      # that week — because the module captured the single 54.0 sample from the aborted start's
      # pump plateau and then discarded every subsequent 0.0 as sub-floor idle trickle (the
      # 15 L/min floor that keeps the 2-5 L/min deep-idle trickle out of the plateau). A real
      # zero-flow fault therefore reads as the healthiest possible state. Fouling is gradual and
      # startupFlow catches it; a closed valve is instantaneous and only this rule catches it.
      #
      # Zero is a distinguishable value here. P52 = 0 ("not stop") means the pump never stops
      # while the unit is on — deep idle is a 5.7-6.9 L/min sensing trickle, and across 9,623
      # post-cleanout samples the ONLY zero readings were the 15 during that lockout.
      #
      # REPLAYED OVER 12,370 MINUTES (2026-08-28 -> 09-06) the rule fires eleven times, and the
      # ten it fires before 2026-08-29 09:00 EDT are the FOULED regime, not false positives: with
      # the strainer clogged the idle trickle fell below the flow meter's detection floor and read
      # a clean 0.0 between every cycle. That period is the one the alarm set was silent through.
      # Expect this rule to fire alongside chiltrix-pump-only-flow-low during severe fouling —
      # zero flow is the far end of the same failure, and the runbook branches on which it is.
      # Across the seven post-cleanout days it fires exactly once: the 09-03 lockout, 16:28-16:37.
      #
      # The switchOn guard uses max, not last, and that detail matters: the controller switched
      # ITSELF off (register 140 -> 0) for the last 4 minutes of the lockout, so a `last` reducer
      # would have suppressed the alarm partway through its own event. max over the window keeps
      # it armed through a self-shutdown while still suppressing a deliberate seasonal switch-off,
      # where switchOn stays 0 for the whole window. (The documented winter state is controller
      # off on the HMI with the breaker on, so switchOn reads 0 and Modbus keeps publishing.)
      #
      # 7m window + 3m for: the 2026-09-03 event ran 16:20-16:36 EDT, so the last nonzero sample
      # leaves the window at 16:26 and the rule fires 16:29 — 7 minutes of firing before the
      # controller released itself. A longer window would have expired with the event.
      - uid: chiltrix-zero-flow
        title: Chiltrix water flow is zero (pump stopped or valve closed)
        condition: F
        data:
          - refId: A
            relativeTimeRange:
              from: 420
              to: 0
            datasourceUid: bdxaqnfllu5fkf
            model:
              datasource:
                type: influxdb
                uid: bdxaqnfllu5fkf
              measurement: hvac.chiller.chiltrix.waterFlow
              policy: default
              resultFormat: time_series
              orderByTime: ASC
              groupBy:
                - type: time
                  params:
                    - $__interval
                - type: fill
                  params:
                    - none
              select:
                - - type: field
                    params:
                      - value
                  - type: mean
                    params: []
              tags: []
              refId: A
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 420
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: max
              datasource:
                type: __expr__
                uid: __expr__
              refId: B
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 420
              to: 0
            datasourceUid: bdxaqnfllu5fkf
            model:
              datasource:
                type: influxdb
                uid: bdxaqnfllu5fkf
              measurement: hvac.chiller.chiltrix.switchOn
              policy: default
              resultFormat: time_series
              orderByTime: ASC
              groupBy:
                - type: time
                  params:
                    - $__interval
                - type: fill
                  params:
                    - none
              select:
                - - type: field
                    params:
                      - value
                  - type: mean
                    params: []
              tags: []
              refId: C
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: D
            relativeTimeRange:
              from: 420
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: C
              reducer: max
              datasource:
                type: __expr__
                uid: __expr__
              refId: D
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: E
            relativeTimeRange:
              from: 420
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: ($B < 1) && ($D > 0)
              datasource:
                type: __expr__
                uid: __expr__
              refId: E
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: F
            relativeTimeRange:
              from: 420
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: E
              datasource:
                type: __expr__
                uid: __expr__
              refId: F
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.5
                  operator:
                    type: and
                  query:
                    params:
                      - E
                  reducer:
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: OK
        execErrState: OK
        for: 3m
        annotations:
          summary: "Chiltrix water flow has read zero for several minutes while the unit is on — check for a closed isolation valve"
          runbook: |
            The chiller's own pump has stopped moving water. The pump normally never stops
            while the unit is on (P52 = 0, "not stop") — idle is a 5.7-6.9 L/min sensing
            trickle, so a true zero means the water side is blocked or the pump is off.

            The controller sees this as P5 "indoor unit water flow error" (measured flow below
            P65) and shuts the pump down for roughly 16 minutes, then retries on its own. It is
            self-clearing, so by the time you read the email the unit may already be running.
            That does not make it benign: it stops cooling and it will repeat while the cause
            is present.

            ANY WORK ON THE LOOP IS THE LEADING CAUSE, and it has two mechanisms, not one.
            The CX65 IOM p70 names both: "If there is not enough flow in the system OR AIR IN
            THE LINES you will get P5 and possibly P1 errors." On 2026-09-03 a valve left closed
            for a couple of minutes during a glycol top-up produced exactly this — inlet 54.7 F,
            pump commanded to 100% (raw.r248), flow 0.0, and a 16-minute lockout while the loop
            coasted to 62.2 F. A top-up also introduces air, so after any fill treat a P5 as
            air until purging rules it out, even if every valve is verified open.

            1. Walk the loop isolation valves, most recently touched first, then purge air
               (IOM p39). After a fill, do both — an open valve does not rule out an air lock.
            2. hvac.chiller.chiltrix.raw.r284 is the controller's fault/lockout register. It
               read 32 throughout that lockout and 0 for every other sample of the surrounding
               eight days. Nonzero corroborates a controller-side trip; the full encoding is
               not mapped, so treat a value other than 32 as new information and record it.
            3. Read the controller's error log for the code and timestamp BEFORE pressing
               anything. No Modbus register latches a fault code (checked: nothing in the 181
               published addresses holds one after the event clears), and the panel log is a
               few rows deep and a Clear erases it — so this is the ONLY chance to tie a code
               to an event. The 2026-09-03 code was lost this way: the log read empty three
               days later, so that event's P5 identification rests on the mechanism alone.
               Touch ERROR on the controller home screen (IOM p55). The log lists
               TIME / DATE / ERROR per row with Back, Clear, Error Reset and Next
               buttons, so find the row by timestamp. "Error Reset" clears
               the fault; "Clear" wipes the history — only ever press Clear after recording it.
               Relevant codes (IOM p63): P5 indoor unit water flow error, P1 high pressure
               protection, P2 low pressure, E14 system anti freeze twice, E17 AC system
               anti freeze twice.
            4. If no valve is closed, this is the severe end of the fouling failure: pull the
               Y-strainer (see chiltrix-pump-only-flow-low) and check for an air lock.
            5. Do NOT open the autofill to recover pressure. This is a glycol loop — top up
               manually with premixed glycol to 21-23 psi, then vent.
        labels:
          severity: warning
          source: chiltrix
        isPaused: false
        notification_settings:
          receiver: graph-bridge

      # ---- Cooling mode in cold weather: a stale cool call the plant cannot clear ----
      # Under option 2 relay control (since 2026-09-14) the HZ-432 holds O or B by mode, so
      # the controller keeps whatever mode the last call gave the panel. A cooling call raised by
      # solar gain on a thermostat left on Auto, or a cold snap arriving after the last cool
      # call, leaves the unit maintaining the tank at 12 C with sub-40 F condenser air. The
      # evaporator runs far colder than in summer, P59 trips on leaving water, and the second
      # trip is E14, which needs a breaker cycle. Nothing on the HZ-432 or the CX can clear a
      # cool call on outdoor temperature (P58 is -27 C; P42/P43 switch-over is unusable with
      # C-H-COM), so this rule is the only automatic notice.
      #
      # Signals are the chiller's own: register 141 mode (0 = cooling), register 202 ambient
      # (Kelvin), register 140 switchOn. 40 F = 277.59 K matches the HZ-432 balance point,
      # below which the panel never asks the heat pump for anything. Means over 30 minutes
      # ride out register glitches; switchOn uses max so a self-shutdown mid-fault stays
      # armed while a deliberate HMI off (the documented winter state) silences it within
      # the window. Fires on the risk state itself — mode cooling and enabled in cold air —
      # so it lands before the compressor's next run, which is the point.
      - uid: chiltrix-cooling-cold
        title: Chiltrix in cooling mode with outdoor air below 40 F
        condition: H
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: bdxaqnfllu5fkf
            model:
              datasource:
                type: influxdb
                uid: bdxaqnfllu5fkf
              measurement: hvac.chiller.chiltrix.operatingMode
              policy: default
              resultFormat: time_series
              orderByTime: ASC
              groupBy:
                - type: time
                  params:
                    - $__interval
                - type: fill
                  params:
                    - none
              select:
                - - type: field
                    params:
                      - value
                  - type: mean
                    params: []
              tags: []
              refId: A
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: mean
              datasource:
                type: __expr__
                uid: __expr__
              refId: B
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: bdxaqnfllu5fkf
            model:
              datasource:
                type: influxdb
                uid: bdxaqnfllu5fkf
              measurement: hvac.chiller.chiltrix.ambientTemp
              policy: default
              resultFormat: time_series
              orderByTime: ASC
              groupBy:
                - type: time
                  params:
                    - $__interval
                - type: fill
                  params:
                    - none
              select:
                - - type: field
                    params:
                      - value
                  - type: mean
                    params: []
              tags: []
              refId: C
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: D
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: C
              reducer: mean
              datasource:
                type: __expr__
                uid: __expr__
              refId: D
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: E
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: bdxaqnfllu5fkf
            model:
              datasource:
                type: influxdb
                uid: bdxaqnfllu5fkf
              measurement: hvac.chiller.chiltrix.switchOn
              policy: default
              resultFormat: time_series
              orderByTime: ASC
              groupBy:
                - type: time
                  params:
                    - $__interval
                - type: fill
                  params:
                    - none
              select:
                - - type: field
                    params:
                      - value
                  - type: mean
                    params: []
              tags: []
              refId: E
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: F
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: E
              reducer: max
              datasource:
                type: __expr__
                uid: __expr__
              refId: F
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: G
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: ($B < 0.5) && ($D < 277.59) && ($F > 0)
              datasource:
                type: __expr__
                uid: __expr__
              refId: G
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: H
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: G
              datasource:
                type: __expr__
                uid: __expr__
              refId: H
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.5
                  operator:
                    type: and
                  query:
                    params:
                      - G
                  reducer:
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: OK
        execErrState: OK
        for: 30m
        annotations:
          summary: "Chiltrix is enabled in cooling mode with outdoor air below 40 F — a stale cool call; put it in heating or switch it off before P59 trips E14"
          runbook: |
            The controller holds the mode of the last call (option 2, both C-H-COM contacts
            closed at rest) and is maintaining the tank at 12 C with condenser air under 40 F.
            Left alone it runs the evaporator toward the P59 antifreeze trip (3 C leaving water),
            and the second trip locks the unit out on E14, which the Error reset button does not
            clear — only a breaker cycle does.

            1. Find the cool call. A hydronic thermostat on Auto with solar gain is the usual
               source; the Relays panel shows HPCOOL = 1 while the panel is in cooling mode. Set the
               four hydronic thermostats to Heat, never Auto, for the heating season.
            2. Give the unit a heating call, or switch the controller off on the HMI. With the
               forecast holding below 40 F the winter procedure applies: controller off on the
               HMI with the breaker on, HZ-432 balance temperature to 50 F or Emergency Heat,
               thermostats on Heat (docs/chiltrix-shoulder-season-heating-plan.md section 9).
            3. Check hvac.chiller.chiltrix.raw.r284 for a nonzero value and read the panel's
               error log before pressing anything: a P59 level-one trip may already be logged.
               If E14 has latched, breaker off for a minute, then on; expect a few minutes
               before the compressor restarts on its own minimum-off timer.
            4. Confirm afterwards: operatingMode reads 1 (or switchOn 0), and this rule clears
               within its 30-minute window.
        labels:
          severity: warning
          source: chiltrix
        isPaused: false
        notification_settings:
          receiver: graph-bridge

      # ---- Mode changeover: the HZ-432 switched between heating and cooling ----
      # Under option 2 the chiller holds the panel's mode and keeps the tank at that
      # mode's temperature, so a changeover sends the old mode's water to the zone that
      # forced it until the chiller swings the tank (about 74 F, 25-45 min of compressor
      # time, ~2 kWh; on 2026-09-15 the kids room got eight minutes of 100-118 F water on
      # a cool call). The panel has no water-temperature input, so nothing prevents it.
      # This rule is the count David asked for on 2026-09-16: every changeover emails and
      # pushes, and the Relays panel shows which zone called the other mode. If they are
      # common, the remedy is an aquastat interlock on the zone-valve common switched by
      # the HPHEAT/HPCOOL spare poles (docs/chiltrix-shoulder-season-heating-plan.md
      # section 7); if rare, thermostat programming. HPHEAT.statenum is the HZ-432's B
      # terminal through the HPHEAT relay's spare pole: 1 in heating mode, 0 otherwise,
      # so a change within the 10-minute window is a changeover in either direction.
      # Fires at once (for: 0s) and clears when the edge leaves the window, so each
      # changeover is one firing and one resolution.
      - uid: hz432-mode-changeover
        title: HZ-432 heat/cool changeover (tank at the old mode's temperature)
        condition: E
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: bdxaqnfllu5fkf
            model:
              datasource:
                type: influxdb
                uid: bdxaqnfllu5fkf
              measurement: electrical.ac.switch.utility.HPHEAT.statenum
              policy: default
              resultFormat: time_series
              orderByTime: ASC
              groupBy:
                - type: time
                  params:
                    - $__interval
                - type: fill
                  params:
                    - none
              select:
                - - type: field
