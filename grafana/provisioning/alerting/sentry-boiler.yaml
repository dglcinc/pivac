apiVersion: 1

# Freshness + sanity alerts for the Sentry 2100 boiler display reader
# (pivac.Sentry -> Tapo C120 RTSP -> 7-segment CV -> hvac.boiler.sentry.*).
# Routes to the same graph-bridge contact point as the other pivac alert files.
#
# Why this file exists: until 2026-07-28 the Sentry paths were the ONLY sensor
# family with no alerting at all. A ~10px drift of the camera's view pushed the
# `display_warp` quad off the top of the digits, clipping segment "a" on every
# digit. water_temp fell from 100% to 2% clean decodes and went silently stale,
# while every other Sentry path kept publishing normally — so nothing looked
# broken from the outside and it was found by eye, 12 days later.
#
# UNITS: unlike the 1-wire rules (Kelvin), the Sentry paths are raw FAHRENHEIT
# as shown on the boiler display. The never-true staleness sentinel is therefore
# `value < -100`, which no plausible reading of any of these paths can reach
# (the module's own range checks are water 40..205 F, air -40..140 F,
# gas 0..240). Detection is driven by noDataState: Alerting.
groups:
  - orgId: 1
    name: sentry-boiler
    folder: pivac
    interval: 1m
    rules:
      # ---------------------------------------------------------------------
      # 1. water temp stale -- the direct alert for the 2026-07-28 failure.
      #    waterTemp is published only when the display's water-temp mode is
      #    both shown AND decoded, so this covers camera/service death *and*
      #    a CV that can no longer read the digits.
      # ---------------------------------------------------------------------
      - uid: sentry-watertemp-stale
        title: Boiler water temp stale (>30m)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: bdxaqnfllu5fkf
            model:
              datasource:
                type: influxdb
                uid: bdxaqnfllu5fkf
              measurement: hvac.boiler.sentry.waterTemp
              policy: default
              resultFormat: time_series
              orderByTime: ASC
              groupBy:
                - type: time
                  params:
                    - $__interval
                - type: fill
                  params:
                    - none
              select:
                - - type: field
                    params:
                      - value
                  - type: mean
                    params: []
              tags: []
              refId: A
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
              refId: B
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - -100
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          summary: "Boiler water temperature has been stale for >30m (hvac.boiler.sentry.waterTemp)"
          runbook: |
            First distinguish "the reader is dead" from "the reader can no longer
            read the digits" -- check whether sentry-cycle-stale is ALSO firing:

              * BOTH firing  -> the service or the camera is down.
                `systemctl status pivac-sentry`; `ping 10.0.0.19`;
                `journalctl -u pivac-sentry -n 50 --no-pager`.

              * ONLY this one -> the service is alive and publishing, but the CV
                cannot decode the water-temp digits. This is the 2026-07-28
                calibration-drift signature.
                1. `journalctl -u pivac-sentry -n 50 --no-pager` and look for
                   "only N plausible read(s) this cycle". If it carries the
                   "display_warp quad has likely drifted" hint, the camera's view
                   has moved and the quad needs re-aiming.
                2. Confirm the camera is still locked to Night/IR (Tapo app ->
                   Advanced -> Night Vision = Night, Night Boost Off). A day/night
                   flip shifts the image and breaks the reader the same way.
                3. Recalibrate `display_warp.corners` in /etc/pivac/config.yml.
                   See CLAUDE.md "Sentry calibration drift" for the procedure and
                   the 2026-07-28 worked example.
        labels:
          severity: warning
          source: sentry
        isPaused: false
        notification_settings:
          receiver: graph-bridge

      # ---------------------------------------------------------------------
      # 2. reader-alive heartbeat. gasInputValue is emitted on EVERY cycle
      #    (idle-fills to 0 when the boiler is off), so it stops only if the
      #    service, the camera or the RTSP stream has died -- never merely
      #    because a digit failed to decode. Pairs with rule 1 to tell the two
      #    failure modes apart without logging in to the Pi.
      # ---------------------------------------------------------------------
      - uid: sentry-cycle-stale
        title: Sentry boiler reader not publishing (>30m)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: bdxaqnfllu5fkf
            model:
              datasource:
                type: influxdb
                uid: bdxaqnfllu5fkf
              measurement: hvac.boiler.sentry.gasInputValue
              policy: default
              resultFormat: time_series
              orderByTime: ASC
              groupBy:
                - type: time
                  params:
                    - $__interval
                - type: fill
                  params:
                    - none
              select:
                - - type: field
                    params:
                      - value
                  - type: mean
                    params: []
              tags: []
              refId: A
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
              refId: B
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - -100
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          summary: "pivac-sentry has published nothing for >30m (hvac.boiler.sentry.gasInputValue)"
          runbook: |
            gasInputValue is emitted every poll cycle regardless of what the
            display shows, so silence here means the reader itself stopped.
            1. `systemctl status pivac-sentry` -- Restart=always, so a dead
               service means it is crash-looping, not simply stopped.
            2. `ping 10.0.0.19` -- the Tapo C120. If unreachable, power-cycle it.
            3. `journalctl -u pivac-sentry -n 50 --no-pager` for RTSP open errors.
            The Pi is a fanless Pi 4 and this service is the hottest thing on it;
            if it died after a thermal event check `vcgencmd get_throttled`.
        labels:
          severity: warning
          source: sentry
        isPaused: false
        notification_settings:
          receiver: graph-bridge

      # ---------------------------------------------------------------------
      # 3. Cross-check the boiler's own outdoor reading against the physical
      #    DS18B20. This is the only rule that can catch a CV that is still
      #    publishing *fresh but wrong* numbers -- the failure mode that hid
      #    the 2026-07-28 drift for 12 days (air misread 78 F while the real
      #    outdoor sensor said 69.5 F). Both are outdoor air, so they track
      #    within a few degrees; sustained disagreement means one is misread.
      #
      #    environment.outside.thermostat.temperature is stored in KELVIN, the
      #    Sentry path in Fahrenheit, so the math node converts before
      #    differencing. (Originally this compared against the physical outdoor
      #    DS18B20 at environment.outside.temperature; that probe became the LBT
      #    buffer-tank sensor on 2026-08-06 and the path is gone. RedLink is also
      #    Kelvin, so the conversion is unchanged.)
      #    The boiler's own outdoor sensor (NTI 6000083604, 10k) has drifted low:
      #    20.7 kOhm on its own at 39 F on 2026-11-14, against 27.5 kOhm for a
      #    sound 10k, so the display reads warm, by 5 F at 65 F and 8 to 8.5 F at
      #    35-45 F at night (2026-10-15 to 11-14). The expected gap is modelled
      #    as 11.85 - 0.1 * RedLink F, and the rule fires on what is left over:
      #    sentry - 0.9 * redlink - 11.85. Over the same month its 2 h mean ran
      #    -0.4 F on average, 98 % of the time inside -4.2 to +2.2 F, and past 5 F
      #    only through the camera remounts of 2026-10-24. So it catches both a
      #    CV misread and further drift of the sensor, which the reset curve
      #    (HI 175, RES 82, plan section 9.1) assumes stays as measured.
      # ---------------------------------------------------------------------
      - uid: sentry-outdoor-divergence
        title: Boiler outdoor temp off its expected drift from the thermostat outdoor sensor
        condition: F
        data:
          - refId: A
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: bdxaqnfllu5fkf
            model:
              datasource:
                type: influxdb
                uid: bdxaqnfllu5fkf
              measurement: hvac.boiler.sentry.outdoorTemp
              policy: default
              resultFormat: time_series
              orderByTime: ASC
              groupBy:
                - type: time
                  params:
                    - $__interval
                - type: fill
                  params:
                    - none
              select:
                - - type: field
                    params:
                      - value
                  - type: mean
                    params: []
              tags: []
              refId: A
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: bdxaqnfllu5fkf
            model:
              datasource:
                type: influxdb
                uid: bdxaqnfllu5fkf
              measurement: environment.outside.thermostat.temperature
              policy: default
              resultFormat: time_series
              orderByTime: ASC
              groupBy:
                - type: time
                  params:
                    - $__interval
                - type: fill
                  params:
                    - none
              select:
                - - type: field
                    params:
                      - value
                  - type: mean
                    params: []
              tags: []
              refId: B
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: mean
              datasource:
                type: __expr__
                uid: __expr__
              refId: C
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: D
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: B
              reducer: mean
              datasource:
                type: __expr__
                uid: __expr__
              refId: D
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: E
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: abs($C - 0.9 * (($D - 273.15) * 9 / 5 + 32) - 11.85)
              datasource:
                type: __expr__
                uid: __expr__
              refId: E
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: F
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: E
              datasource:
                type: __expr__
                uid: __expr__
              refId: F
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 5
                  operator:
                    type: and
                  query:
                    params:
                      - E
                  reducer:
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: OK
        execErrState: OK
        for: 2h
        annotations:
          summary: "Boiler outdoor temp is >5 F off its expected drift from RedLink for 2h — the display reader is misreading digits, or the boiler's outdoor sensor has drifted further"
          runbook: |
            hvac.boiler.sentry.outdoorTemp (read off the boiler display by CV) and
            environment.outside.thermostat.temperature (Honeywell RedLink) are both
            outdoor air. The boiler's sensor reads warm by a known drift,
            11.85 - 0.1 * RedLink F (8 F at 38 F, 12 F at 0 F); this rule fires
            when the gap departs from that by more than 5 F for 2h while BOTH are
            still publishing. Either the CV is producing fresh-but-wrong numbers
            (and then the water-temp digits on the same display are wrong too),
            or the sensor has drifted again and the reset curve no longer
            delivers the water temperatures it was set for.
            0. Read the boiler's `air` digits by eye or on the eyecheck email. If
               the display agrees with the published value, the CV is fine and the
               sensor moved: lift a lead at O or D, measure the sensor and compare
               with docs/chiltrix-shoulder-season-heating-plan.md section 9.1,
               then refit HI and RES there (a sound replacement goes to HI 160,
               RES 80).
            NB this rule originally compared against environment.outside.temperature,
            the physical outdoor DS18B20. That probe was repurposed as the LBT
            buffer-tank sensor on 2026-08-06 and the path no longer exists, so
            RedLink is now the only independent outdoor source and is the trusted
            side of this comparison.
            1. Treat RedLink as the reference. If the Sentry value is the one that
               moved, it is a decode problem: check the journal for "display_warp
               quad has likely drifted", confirm the camera is still locked to
               Night/IR, and recalibrate.
            2. If RedLink looks wrong instead, check the redlink-* rules -- a
               half-broken Honeywell session can publish stale values rather than
               stopping outright.
            3. Grab a frame and read the display by eye before trusting either
               number -- see CLAUDE.md "Sentry calibration drift".
            noDataState is OK so this never fires merely because a source is down;
            the staleness rules above cover that.
        labels:
          severity: info
          source: sentry
        isPaused: false
        notification_settings:
          receiver: graph-bridge

      # ---------------------------------------------------------------------
      # 4. Calibration health, from the reader itself. decodeMargin is the
      #    separation between the segments read as lit and those read as unlit,
      #    in grey levels, published every cycle. A quad can decode 100 % clean
      #    on the digits it happens to see and still sit on a knife edge: the
      #    2026-09-09 quad read about 10 here from the moment it went live and
      #    started reading every 6 as an 8 two days later, when the outdoor
      #    temperature reached the 60s. A sound calibration reads 40 or more.
      #    This fires on the margin itself, so it catches a drift before any
      #    value goes wrong and two days before sentry-outdoor-divergence did.
      #    noDataState is OK: sentry-cycle-stale covers a dead reader.
      # ---------------------------------------------------------------------
      - uid: sentry-decode-margin
        title: Sentry display reader calibration on a knife edge (decodeMargin < 20)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: bdxaqnfllu5fkf
            model:
              datasource:
                type: influxdb
                uid: bdxaqnfllu5fkf
              measurement: hvac.boiler.sentry.decodeMargin
              policy: default
              resultFormat: time_series
              orderByTime: ASC
              groupBy:
                - type: time
                  params:
                    - $__interval
                - type: fill
                  params:
                    - none
              select:
                - - type: field
                    params:
                      - value
                  - type: mean
                    params: []
              tags: []
              refId: A
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: mean
              datasource:
                type: __expr__
                uid: __expr__
              refId: B
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 20
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: "Sentry display reader's lit/unlit segment separation has averaged under 20 grey levels for an hour (hvac.boiler.sentry.decodeMargin) — the display_warp quad is on a knife edge and digits will start misreading"
          runbook: |
            The reader measures every segment of every digit each cycle and
            publishes the gap between the dimmest segment it read as lit and the
            brightest it read as unlit. Sound calibrations read 40-60; the quad
            that read every 6 as an 8 in September 2026 read about 10.
            1. The bridge has emailed an eyecheck (subject "[Sentry eyecheck]")
               with a fresh capture and the decode under the live quad; read it.
            2. Confirm the camera is still locked to Night/IR (colour deltas
               0.00 in the eyecheck report). A day/night flip is a different fix.
            3. Recalibrate display_warp.corners per CLAUDE.md, scoring candidates
               on this margin across their +/-1 px neighbours, never on the clean
               rate alone; then re-aim leds/indicators in the same pass.
        labels:
          severity: warning
          source: sentry
        isPaused: false
        notification_settings:
          receiver: graph-bridge
