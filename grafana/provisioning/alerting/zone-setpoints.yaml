              from: 1800
              to: 0
            datasourceUid: bdxaqnfllu5fkf
            model:
              datasource:
                type: influxdb
                uid: bdxaqnfllu5fkf
              measurement: electrical.ac.switch.utility.HPCOOL.statenum
              policy: default
              resultFormat: time_series
              orderByTime: ASC
              groupBy:
                - type: time
                  params:
                    - $__interval
                - type: fill
                  params:
                    - none
              select:
                - - type: field
                    params:
                      - value
                  - type: mean
                    params: []
              tags: []
              refId: GQ
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: G
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: GQ
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
              refId: G
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: M
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$G > 0.5 && (abs($A - $B) > 2 || abs($A - $C) > 2 || abs($A - $D) > 2 || abs($A - $E) > 2 || abs($B - $C) > 2 || abs($B - $D) > 2 || abs($B - $E) > 2 || abs($C - $D) > 2 || abs($C - $E) > 2 || abs($D - $E) > 2)"
              datasource:
                type: __expr__
                uid: __expr__
              refId: M
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: T
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: M
              datasource:
                type: __expr__
                uid: __expr__
              refId: T
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.5
                  operator:
                    type: and
                  query:
                    params:
                      - M
                  reducer:
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: OK
        execErrState: OK
        for: 2h
        annotations:
          summary: "Two zones' cooling setpoints differ by more than 2 F - in the open plan the colder zone is cooling its neighbours and will run long"
          runbook: |
            Informational. The house is open plan: only the bedrooms have doors, the two
            lower-level zones share one hallway, and a stairwell joins the downstairs
            family room to the great room. A zone set more than 2 F from another
            conditions its neighbours as well as itself. Measured in the month to
            2026-09-17: the kids room at 73 F beside a 76 F family room ran 0.72 evening
            duty against 0.53 at 74 F, 1.5 times, the ratio of the two gaps to 76 F, and
            an 11-hour continuous call on 2026-09-16. Read the five coolset values on the
            thermostat tiles and bring the outlier within 2 F of the rest. A scheduled
            setback that lasts under two hours does not fire this rule.
        labels:
          severity: info
          source: redlink
        isPaused: false
        notification_settings:
          receiver: graph-bridge
          repeat_interval: 24h
