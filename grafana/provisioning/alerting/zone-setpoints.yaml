# Zone setpoint spread. The house is open plan, so a zone set apart from its
# neighbours carries their load: docs/unico-cooling-assessment-and-tuning.md
# Appendix J has the measurement. Each rule compares the five RedLink setpoints
# pairwise (Grafana math has no max/min across queries) and fires when any two
# differ by more than 2 F for two hours. The cooling rule is gated on HPCOOL and
# the heating rule on HPHEAT, the HZ-432's latched mode outputs, so the setpoints
# of the mode the panel is not in never fire. Setpoints are stored in F.
apiVersion: 1

groups:
  - orgId: 1
    name: zone-setpoints
    folder: pivac
    interval: 1m
    rules:
      - uid: zone-coolset-spread
        title: Zone cooling setpoints more than 2 F apart
        condition: T
        data:
          - refId: AQ
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: bdxaqnfllu5fkf
            model:
              datasource:
                type: influxdb
                uid: bdxaqnfllu5fkf
              measurement: environment.inside.thermostat.KIDS_ROOM.coolset
              policy: default
              resultFormat: time_series
              orderByTime: ASC
              groupBy:
                - type: time
                  params:
                    - $__interval
                - type: fill
                  params:
                    - none
              select:
                - - type: field
                    params:
                      - value
                  - type: mean
                    params: []
              tags: []
              refId: AQ
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: AQ
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: BQ
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: bdxaqnfllu5fkf
            model:
              datasource:
                type: influxdb
                uid: bdxaqnfllu5fkf
